     <script type="text/javascript">
      // solution from https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function(s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          var basePath = '/gh-pages-browser-router/dev';

          window.history.replaceState(
            null,
            null,
            basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>
